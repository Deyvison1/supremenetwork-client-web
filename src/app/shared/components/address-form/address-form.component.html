<div [formGroup]="form">
  <div class="form-grid">
    <sn-input
      label="CEP"
      placeholder="CEP"
      type="text"
      autocomplete="off"
      formControlName="cep"
      appCep
    />

    <sn-input
      label="Logradouro"
      placeholder="Logradouro"
      type="text"
      autocomplete="off"
      formControlName="logradouro"
    />

    <sn-input
      label="Complemento"
      placeholder="Complemento"
      type="text"
      autocomplete="off"
      formControlName="complemento"
    />

    <sn-input
      label="Bairro"
      placeholder="Bairro"
      type="text"
      autocomplete="off"
      formControlName="bairro"
    />

    <sn-input
      label="Localidade"
      placeholder="Localidade"
      type="text"
      autocomplete="off"
      formControlName="localidade"
    />

    <sn-select formControlName="uf" [options]="ufs" label="UF" />
  </div>
</div>
