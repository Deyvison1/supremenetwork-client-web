
@if (isAuthenticated) {
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__logo">SupremeNetwork</span>
      </div>

      <nav class="sidebar__nav">
        @for (item of menuItems(); track item.route) {
          <a
            class="sidebar__item"
            [routerLink]="item.route"
            routerLinkActive="sidebar__item--active"
            [routerLinkActiveOptions]="{ exact: true }"
            [matTooltip]="item.label"
            matTooltipPosition="right"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar__title">
          <span>Dashboard</span>
        </div>

        <div class="topbar__actions">
          <button
            mat-icon-button
            matTooltip="Notificações"
            aria-label="Notificações"
          >
            <mat-icon>notifications</mat-icon>
          </button>

          <button
            mat-icon-button
            matTooltip="Início"
            routerLink="/home"
            aria-label="Início"
          >
            <mat-icon>home</mat-icon>
          </button>

          <button
            class="topbar__profile"
            [matMenuTriggerFor]="profileMenu"
            aria-label="Menu do perfil"
          >
            <mat-icon>account_circle</mat-icon>

            <span class="topbar__user">
              {{ getUserName }}
            </span>

            <mat-icon class="topbar__profile-arrow">
              expand_more
            </mat-icon>
          </button>
        </div>

        <mat-menu #profileMenu="matMenu" class="profile-menu">
          <button mat-menu-item routerLink="/meu-perfil">
            <mat-icon>person</mat-icon>
            <span>Ver meu perfil</span>
          </button>

          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      </header>

      <main class="layout__content">
        <router-outlet />
      </main>

      <footer class="footer">
        <app-footer />
      </footer>
    </div>
  </div>
}
@else {
  <div class="public-layout">
    <header class="public-header">
      <a class="public-header__brand" routerLink="/home">
        <span class="public-header__logo">SupremeNetwork</span>
      </a>

      <nav class="public-header__nav">
        <a routerLink="/home">Início</a>
        <a routerLink="/home" fragment="planos">Planos</a>
      </nav>

      <div class="public-header__actions">
        <button
          mat-flat-button
          color="primary"
          (click)="login()"
        >
          <mat-icon>login</mat-icon>
          Entrar
        </button>
      </div>
    </header>

    <main class="public-layout__content">
      <router-outlet />
    </main>

    <footer class="footer">
      <app-footer />
    </footer>
  </div>
}

<app-loading />
