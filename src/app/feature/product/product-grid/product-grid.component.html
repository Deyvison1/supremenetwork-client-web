<div class="page-container">
  <app-page-header [titleInput]="'Listagem de Produtos'" [isGrid]="true" />

  <div class="product-list card">
    <div class="list-toolbar">
      <div></div>

      <sn-button
        type="button"
        variant="flat"
        icon="add"
        label="Novo produto"
        (click)="newProduct()"
        *appHasRole="['PRODUCT_MANAGE']"
      />
    </div>

    <div class="filter-container">
      <app-product-filter
        (searchEvent)="onFilterChange($event)"
        (clearEvent)="onFilterChange({})"
      />
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="changeSortBy($event)">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>

          <td mat-cell *matCellDef="let product" [matTooltip]="product.category?.name">
            {{ product.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrição</th>

          <td mat-cell *matCellDef="let product">
            {{ product.description || '—' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column">Ações</th>

          <td mat-cell *matCellDef="let product" class="actions-column">
            <div class="actions">
              <sn-button
                type="button"
                variant="icon"
                icon="edit"
                ariaLabel="Editar"
                title="Editar"
                (click)="editProduct(product.id)"
                *appHasRole="['PRODUCT_MANAGE']"
              />

              <sn-button
                type="button"
                variant="icon"
                icon="delete"
                ariaLabel="Excluir"
                title="Excluir"
                (click)="confirmaticonDeleteClient(product.id, product.name)"
                *appHasRole="['PRODUCT_MANAGE']"
              />
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr *matNoDataRow>
          <td class="mat-cell empty" [attr.colspan]="displayedColumns.length">
            Nenhum produto encontrado.
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="pageConfig.totalElements"
      [pageIndex]="pageConfig.page"
      [pageSize]="pageConfig.pageSize"
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
      (page)="onPageChange($event)"
    />
  </div>
</div>
